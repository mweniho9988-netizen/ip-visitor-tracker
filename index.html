
<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IP Visitor Tracker</title>
<style>
body {
  font-family: Arial, sans-serif;
  background: #f5f7fa;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  margin: 0;
}
.card {
  background: white;
  padding: 35px;
  border-radius: 15px;
  max-width: 420px;
  width: 85%;
  box-shadow: 0 5px 25px #0001;
  text-align: center;
}
h2 { color: #26364a; }
p { color: #64748b; line-height: 1.7; }
button {
  background: #2563eb;
  color: white;
  border: 0;
  padding: 13px 25px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 16px;
}
button:disabled { opacity: .5; }
#status { margin-top: 20px; }
</style>
</head>
<body>
<div class="card">
  <h2>IP Visitor Tracker</h2>
  <p>
    เว็บไซต์นี้ขอความยินยอมในการเก็บ
    IP Address และเวลาที่เข้าชม
    เพื่อใช้สำหรับสถิติผู้เข้าชมเว็บไซต์
  </p>
  <p>
    ข้อมูลจะถูกเก็บอย่างจำกัดและไม่เปิดเผย
    ต่อบุคคลอื่นโดยไม่ได้รับอนุญาต
  </p>
  <button id="consent">ยินยอมและดำเนินการ</button>
  <div id="status"></div>
</div>
<script>
document.getElementById("consent").onclick = async () => {
  const status = document.getElementById("status");
  const button = document.getElementById("consent");
  button.disabled = true;
  status.textContent = "กำลังดำเนินการ...";
  try {
    const response = await fetch("/api/consent", {
      method: "POST"
    });
    if (!response.ok) throw new Error();
    status.textContent = "บันทึกความยินยอมแล้ว";
  } catch {
    status.textContent =
      "ระบบยังไม่พร้อม กรุณาลองใหม่ภายหลัง";
    button.disabled = false;
  }
};
</script>
</body>
</html>
